<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ثعبان عبدالله</title>
<style>
html,body{margin:0;background:#07110c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%;}
body{padding:14px;display:flex;justify-content:center;}
.app{width:100%;max-width:620px;}
h1{margin:4px 0 2px;font-size:30px}
.sub{color:#a9c0b0;font-size:13px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#102016;border-radius:15px;padding:10px;text-align:center;border:1px solid #203527}
.stat small{display:block;color:#92ad9a;font-size:11px}
.stat b{font-size:22px}
.box{position:relative;background:#0d1b12;border-radius:22px;padding:9px;border:1px solid #1f3326;box-shadow:0 16px 50px rgba(0,0,0,.35)}
canvas{display:block;width:100%;aspect-ratio:1/1;background:#09150e;border-radius:16px;touch-action:none}
.overlay{position:absolute;inset:9px;background:rgba(3,12,7,.72);border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;z-index:5}
.overlay.hidden{display:none}
.face{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 7px rgba(93,242,138,.15);margin-bottom:8px}
.overlay h2{margin:8px 0;font-size:28px}
.overlay p{color:#d1dfd5;font-size:14px;line-height:1.6;margin:4px 0 14px}
button{border:0;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}
.start{background:#5df28a;color:#06210e;padding:13px 20px;font-size:16px;min-width:150px}
.ctrls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:12px}
.panel{background:#0f1e15;border:1px solid #203527;border-radius:18px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{background:#1b3021;color:#e8fff0;padding:10px 12px}
.small.active{background:#285c37;outline:1px solid #5df28a}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,54px);gap:6px;direction:ltr}
.dpad button{background:#17291d;color:#fff;font-size:22px;border:1px solid #26422f}
.up{grid-column:2;grid-row:1} .left{grid-column:1;grid-row:2} .mid{grid-column:2;grid-row:2} .right{grid-column:3;grid-row:2} .down{grid-column:2;grid-row:3}
.help{text-align:center;color:#90a796;font-size:12px;margin-top:10px;line-height:1.6}
.notice{background:#16261b;border:1px solid #2a4632;border-radius:14px;padding:10px;margin-top:10px;color:#cfe0d3;font-size:12px}
@media(max-width:520px){.ctrls{grid-template-columns:1fr}.dpad{margin:auto;grid-template-columns:repeat(3,64px)}}
</style>
</head>

function resetState() {
  if (timer) clearTimeout(timer);
  snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dx = 1; dy = 0; queued = null;
  score = 0; paused = false; running = false;
  placeFood();
  updateStats();
  draw();
}

function startGame() {
  if (!running) {
    resetState();
    running = true;
  }
  paused = false;
  document.getElementById('overlay').className = 'overlay hidden';
  loop();
}

function restartGame() {
  resetState();
  running = true;
  document.getElementById('overlay').className = 'overlay hidden';
  loop();
}

function loop() {
  if (!running || paused) return;
  if (timer) clearTimeout(timer);
  timer = setTimeout(function(){
    tick();
    if (running && !paused) loop();
  }, speed);
}

function tick() {
  if (queued) {
    var nd = queued;
    queued = null;
    if (!(nd.x === -dx && nd.y === -dy)) {
      dx = nd.x; dy = nd.y;
    }
  }

  var h = {x:snake[0].x + dx, y:snake[0].y + dy};

  if (mode === 'wrap') {
    if (h.x < 0) h.x = N-1;
    if (h.x >= N) h.x = 0;
    if (h.y < 0) h.y = N-1;
    if (h.y >= N) h.y = 0;
  } else {
    if (h.x < 0 || h.x >= N || h.y < 0 || h.y >= N) {
      gameOver(); return;
    }
  }

  var eat = (h.x === food.x && h.y === food.y);
  var limit = eat ? snake.length : snake.length - 1;
  for (var i=0;i<limit;i++) {
    if (snake[i].x === h.x && snake[i].y === h.y) {
      gameOver(); return;
    }
  }

  snake.unshift(h);
  if (eat) {
    score += 10;
    if (score > best) best = score;
    placeFood();
    try { if (navigator.vibrate) navigator.vibrate(18); } catch(e) {}
  } else {
    snake.pop();
  }

  updateStats();
  draw();
}

function gameOver() {
  running = false;
  paused = false;
  if (timer) clearTimeout(timer);
  if (score > best) best = score;
  updateStats();
  document.getElementById('ovTitle').innerHTML = score === best && score > 0 ? '🔥 رقم قياسي!' : 'انتهت الجولة';
  document.getElementById('ovText').innerHTML = 'نتيجتك ' + score + ' نقطة — اضغط للعب من جديد.';
  document.getElementById('startButton').innerHTML = 'العب من جديد';
  document.getElementById('overlay').className = 'overlay';
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (!paused) loop();
}

function go(d) {
  var nd;
  if (d === 'up') nd = {x:0,y:-1};
  if (d === 'down') nd = {x:0,y:1};
  if (d === 'left') nd = {x:-1,y:0};
  if (d === 'right') nd = {x:1,y:0};
  if (!nd) return;
  if (nd.x === -dx && nd.y === -dy) return;
  queued = nd;
  if (!running) startGame();
}

function setSpeed(v,id) {
  speed = v;
  var ids = ['spd1','spd2','spd3'];
  for (var i=0;i<ids.length;i++) document.getElementById(ids[i]).className = 'small';
  document.getElementById(id).className = 'small active';
  if (running && !paused) loop();
}

function setMode(v) {
  mode = v;
  document.getElementById('modeWall').className = v==='wall' ? 'small active' : 'small';
  document.getElementById('modeWrap').className = v==='wrap' ? 'small active' : 'small';
}

function placeFood() {
  var ok = false;
  while (!ok) {
    food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)};
    ok = true;
    for (var i=0;i<snake.length;i++) {
      if (snake[i].x===food.x && snake[i].y===food.y) {ok=false;break;}
    }
  }
}

function updateStats() {
  document.getElementById('score').innerHTML = score;
  document.getElementById('best').innerHTML = best;
  document.getElementById('len').innerHTML = snake.length;
}

function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function draw() {
  ctx.fillStyle='#09150e';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle='rgba(255,255,255,.035)';
  ctx.lineWidth=1;
  for(var g=1;g<N;g++) {
    var p=g*C;
    ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke();
  }

  var fx=food.x*C+C/2, fy=food.y*C+C/2, fr=C*.39;
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,.45)';
  ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(fx,fy,fr+3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(fx,fy,fr,0,Math.PI*2);ctx.clip();
  if (face.complete) {
    ctx.drawImage(face,fx-fr,fy-fr,fr*2,fr*2);
  } else {
    ctx.fillStyle='#ddd';ctx.fillRect(fx-fr,fy-fr,fr*2,fr*2);
  }
  ctx.restore();

  for(var i=snake.length-1;i>=0;i--) {
    var s=snake[i];
    var pad=i===0?2:4;
    var x=s.x*C+pad,y=s.y*C+pad,w=C-pad*2;
    ctx.fillStyle=i===0?'#75ff9a':'#39c964';
    rr(x,y,w,w,i===0?10:8);
    ctx.fill();
  }
}

document.onkeydown = function(e) {
  e = e || window.event;
  var k = (e.key || '').toLowerCase();
  if (k==='arrowup' || k==='w') {go('up'); return false;}
  if (k==='arrowdown' || k==='s') {go('down'); return false;}
  if (k==='arrowleft' || k==='a') {go('left'); return false;}
  if (k==='arrowright' || k==='d') {go('right'); return false;}
  if (k===' ') {togglePause(); return false;}
};

var sx=0,sy=0;
canvas.addEventListener('touchstart',function(e){
  if(!e.touches || !e.touches[0]) return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',function(e){
  if(!e.changedTouches || !e.changedTouches[0]) return;
  var ex=e.changedTouches[0].clientX, ey=e.changedTouches[0].clientY;
  var ax=ex-sx, ay=ey-sy;
  if(Math.max(Math.abs(ax),Math.abs(ay))<18) return;
  if(Math.abs(ax)>Math.abs(ay)) go(ax>0?'right':'left');
  else go(ay>0?'down':'up');
},{passive:true});

face.onload = function(){ draw(); };
resetState();
</script>
</body>
</html>
